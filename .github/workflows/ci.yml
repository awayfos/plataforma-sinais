name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Versões resolvidas da API e das contas
        run: uv pip list | grep -iE "fastapi|starlette|uvicorn|argon2|pyotp|cryptography" || true
      - name: Gera o OpenAPI a partir do código
        run: |
          uv run python -m sinais.api.openapi > ../docs/api/openapi-v1.gerado.json
          echo "=== OPENAPI INICIO ==="; base64 -w 0 ../docs/api/openapi-v1.gerado.json; echo; echo "=== OPENAPI FIM ==="
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-v1
          path: docs/api/openapi-v1.gerado.json
      - run: uv run pytest --cov=sinais.core --cov=sinais.logs --cov=sinais.dados --cov=sinais.contas --cov-fail-under=90
      - name: Snapshot do OpenAPI (docs/api/openapi-v1.json) igual ao código
        run: diff -u ../docs/api/openapi-v1.json ../docs/api/openapi-v1.gerado.json

  integracao:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SINAIS_TESTE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SINAIS_TESTE_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest -m integracao tests/integracao -v

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml --env-file .env.example config -q

  ticks:
    # Prova "100% igual à Binance": grava aggTrades reais por >= 3 minutos e compara cada
    # minuto (e o 5m) montado tick a tick com os klines oficiais, com igualdade exata.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run python -m sinais.processos.prova_ticks --saida relatorio-ticks.md

  fumaca:
    # Sobe o ambiente completo e coleta dados reais da Binance (endpoint só de dados de mercado).
    runs-on: ubuntu-latest
    needs: [backend, integracao, infra]
    steps:
      - uses: actions/checkout@v4
      - name: Ambiente de teste
        run: |
          cp .env.example .env.ci
          sed -i 's#^SINAIS_BINANCE_REST_URL=.*#SINAIS_BINANCE_REST_URL=https://data-api.binance.vision#' .env.ci
          sed -i 's#^SINAIS_HISTORICO_DIAS=.*#SINAIS_HISTORICO_DIAS=1#' .env.ci
          sed -i 's#^SINAIS_HISTORICO_DIAS_1S=.*#SINAIS_HISTORICO_DIAS_1S=1#' .env.ci
      - run: ENV_FILE=.env.ci infra/fumaca.sh
