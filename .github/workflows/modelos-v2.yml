name: Modelos v2

# Fase 6b: treina e avalia o modelo v2 (fs-2 + filtro de apertados) com rótulos e simulação em
# preços de 1 s, em walk-forward sobre o histórico oficial da Binance, e publica o relatório de
# decisão. Disparo manual. Rodada confirmatória pré-registrada (docs/fases/fase-06b-modelo-v2.md):
# "--meses 27 --fim 2027-01 --payout 0.86 --entrada-max-s 10 --tolerancia-atr 0.5 --sem-ablacao-fs1"
on:
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Argumentos de sinais.modelos.decisao_v2"
        default: "--meses 24 --fim 2026-10 --payout 0.86"

jobs:
  modelos-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Avaliação v2
        env:
          ARGUMENTOS: ${{ inputs.argumentos }}
        run: |
          mkdir -p relatorio
          # shellcheck disable=SC2086 # divisão em palavras intencional (lista de argumentos)
          /usr/bin/time -v uv run python -m sinais.modelos.decisao_v2 $ARGUMENTOS \
            --saida relatorio 2>&1 | tee relatorio/execucao.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-modelos-v2
          path: backend/relatorio/
