name: Frontend

# Sem package-lock.json: o ambiente de desenvolvimento não tem acesso ao registro npm,
# então as dependências são resolvidas aqui, pelas faixas do package.json (ver frontend/README.md).
on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  verificacao:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install
        run: npm install --no-audit --no-fund || { tail -n 80 ~/.npm/_logs/*-debug-0.log; exit 1; }
      - run: npm ls next react react-dom lightweight-charts tailwindcss vitest @playwright/test typescript eslint
      - run: npm run lint
      - run: npm run typecheck

  testes:
    name: Testes (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install
        run: npm install --no-audit --no-fund || { tail -n 80 ~/.npm/_logs/*-debug-0.log; exit 1; }
      - run: npm test

  build-e2e:
    name: Build e E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install
        run: npm install --no-audit --no-fund || { tail -n 80 ~/.npm/_logs/*-debug-0.log; exit 1; }
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: frontend/capturas
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
