name: Situações — confirmação

# Design §9b.2: reprocessa, todo mês, os meses novos fechados (a partir de 2026-11) com o mesmo
# código da descoberta e imprime o acumulado da confirmação e os sinais liquidados no log.
# O arquivo mensal da Binance sai nos primeiros dias do mês seguinte; roda no dia 3.
on:
  schedule:
    - cron: "17 7 3 * *"
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Argumentos extras de sinais.situacoes.confirmacao"
        default: ""
  # TEMPORÁRIO: teste de fumaça a partir do ramo da Fase 6c (meses já vistos; não confirmatório)
  push:
    branches: [fase-06c-situacoes]
    paths: [.github/workflows/situacoes-confirmacao.yml]

jobs:
  confirmacao:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Fumaça (TEMPORÁRIO)
        if: github.event_name == 'push'
        run: |
          python3 -c "import json; print(json.dumps([{'ativo': a, 'variacao': v, 'espelho': e, 'expiracao': '15m', 'camada': 'A'} for a in ('BTCUSDT', 'ETHUSDT') for v in ('S1', 'S8') for e in ('topo', 'fundo')]))" > /tmp/fumaca.json
          uv run python -m sinais.situacoes.confirmacao --candidatas /tmp/fumaca.json \
            --primeiro 2026-10 --aquecimento 2026-09 --ate 2026-10 | head -60
      - name: Confirmação
        if: github.event_name != 'push'
        env:
          ARGUMENTOS: ${{ inputs.argumentos || '' }}
        run: |
          # shellcheck disable=SC2086 # divisão em palavras intencional
          uv run python -m sinais.situacoes.confirmacao $ARGUMENTOS
