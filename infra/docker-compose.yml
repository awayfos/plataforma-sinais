name: plataforma-sinais

services:
  db:
    image: timescale/timescaledb:latest-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migracoes:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    environment: &ambiente_backend
      SINAIS_AMBIENTE: ${SINAIS_AMBIENTE:-dev}
      SINAIS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SINAIS_REDIS_URL: redis://redis:6379/0
      SINAIS_NIVEL_LOG: ${SINAIS_NIVEL_LOG:-INFO}
      SINAIS_HISTORICO_DIAS: ${SINAIS_HISTORICO_DIAS:-730}
      SINAIS_HISTORICO_DIAS_1S: ${SINAIS_HISTORICO_DIAS_1S:-2}
      SINAIS_BINANCE_REST_URL: ${SINAIS_BINANCE_REST_URL:-https://api.binance.com}
      SINAIS_BINANCE_WS_URL: ${SINAIS_BINANCE_WS_URL:-wss://data-stream.binance.vision}
      # API e contas (ADR-12). A chave cifra o segredo TOTP dos admins: gere uma por ambiente.
      SINAIS_CHAVE_CIFRA: ${SINAIS_CHAVE_CIFRA:?defina SINAIS_CHAVE_CIFRA no .env}
      SINAIS_COOKIE_SEGURO: ${SINAIS_COOKIE_SEGURO:-true}
      SINAIS_SESSOES_SIMULTANEAS: ${SINAIS_SESSOES_SIMULTANEAS:-1}
      SINAIS_REGISTRO_MODELOS: ${SINAIS_REGISTRO_MODELOS:-/app/registro}
      # Origens aceitas no WebSocket (obrigatória com SINAIS_AMBIENTE=prod).
      SINAIS_ORIGENS_PERMITIDAS: ${SINAIS_ORIGENS_PERMITIDAS:-http://localhost:3000}
      # CIDRs dos proxies (Next, nginx) cujo X-Forwarded-For é lido.
      SINAIS_PROXIES_CONFIAVEIS: ${SINAIS_PROXIES_CONFIAVEIS:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  coletor:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    environment: *ambiente_backend
    depends_on:
      migracoes:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["python", "-m", "sinais.processos.coletor_binance"]
    restart: unless-stopped

  ticks:
    # aggTrade da Binance → Redis Pub/Sub ticks:{SIMBOLO} (efêmero, não grava no banco).
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    environment: *ambiente_backend
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "sinais.processos.ticks_binance"]
    restart: unless-stopped

  motor_analise:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    environment: *ambiente_backend
    depends_on:
      migracoes:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["python", "-m", "sinais.processos.motor_analise"]
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    environment: *ambiente_backend
    depends_on:
      migracoes:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Registro de modelos (campeões); só leitura para a API.
      - registro_modelos:/app/registro:ro
    command: ["python", "-m", "sinais.processos.api"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/publico/estatisticas', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  dados_db:
  registro_modelos:
