[project]
name = "sinais"
version = "0.1.0"
description = "Plataforma de inteligência de mercado e sinais validados para opções binárias"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.13,<3",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=6",
    "mypy>=1.15",
    "ruff>=0.9",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sinais"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
