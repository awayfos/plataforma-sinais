[project]
name = "sinais"
version = "0.1.0"
description = "Plataforma de inteligência de mercado e sinais validados para opções binárias"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.13,<3",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "redis>=6,<8",
    "pandas>=2.2,<4",
    "numpy>=2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2",
    # API (ADR-03). FastAPI é 0.x: a versão exata é fixada com == após a resolução no CI.
    "fastapi>=0.115,<0.200",
    "uvicorn[standard]>=0.32,<1",
    # Contas (ADR-12): Argon2id, TOTP e cifra do segredo TOTP.
    "argon2-cffi>=23.1,<26",
    "pyotp>=2.9,<3",
    "cryptography>=44,<52",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=6",
    "mypy>=1.15",
    "ruff>=0.9",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sinais"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integracao: precisa de PostgreSQL/TimescaleDB e Redis reais (roda no CI)"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asyncpg.*", "asyncpg", "websockets", "websockets.*", "sqlalchemy", "sqlalchemy.*", "alembic", "alembic.*", "redis", "redis.*", "pandas", "pandas.*", "scipy", "scipy.*", "sklearn", "sklearn.*", "joblib", "joblib.*", "fastapi", "fastapi.*", "starlette", "starlette.*", "uvicorn", "uvicorn.*", "argon2", "argon2.*", "pyotp", "pyotp.*"]
ignore_missing_imports = true

# Os decoradores do FastAPI são tipados, mas o FastAPI só existe no ambiente do CI.
[[tool.mypy.overrides]]
module = ["sinais.api.*", "tests.unit.api.*", "tests.integracao.*"]
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
# N818 exige o sufixo inglês "Error"; o projeto usa nomes em português com o prefixo "Erro".
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
